
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111111">
<title>ناشناس اسکرول گپ</title>

<style>
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;
background:radial-gradient(ellipse at top,#351014 0,#151515 42%,#090909 100%);
color:#f5f5f5;font-family:Tahoma,Arial,sans-serif;
display:flex;align-items:center;justify-content:center;padding:22px
}
.card{
width:100%;max-width:460px;background:#151515;
border:1px solid #4b2024;border-radius:24px;padding:26px;
box-shadow:0 18px 60px #0009,0 0 30px #b21e2b18
}
.logo{text-align:center;margin-bottom:24px}
.mark{
display:inline-grid;place-items:center;width:58px;height:58px;
border-radius:18px;background:linear-gradient(145deg,#f04452,#8d101b);
font-size:28px;font-weight:bold;box-shadow:0 8px 28px #e21d303d
}
h1{font-size:25px;margin:14px 0 7px}
.sub{color:#aaa;font-size:13px;line-height:1.9}
.line{height:1px;background:linear-gradient(90deg,transparent,#a8202b,transparent);margin:22px 0}
label{display:block;font-size:14px;font-weight:bold;margin:16px 0 9px}
.admins{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.admin{position:relative}
.admin input{position:absolute;opacity:0}
.admin span{
display:block;text-align:center;padding:13px 8px;
border:1px solid #393939;border-radius:12px;
background:#202020;color:#ddd;cursor:pointer
}
.admin input:checked+span{
border-color:#f04452;background:#51171d;color:#fff;
box-shadow:0 0 0 1px #f0445244
}
textarea{
width:100%;min-height:145px;resize:vertical;
background:#202020;border:1px solid #3b3b3b;
border-radius:14px;color:#fff;padding:14px;
font:14px Tahoma;line-height:1.9;outline:none
}
textarea:focus{border-color:#e33b49}
.hint{color:#888;font-size:11px;margin-top:7px;line-height:1.8}
.file-box{
margin-top:17px;padding:15px;
border:1px dashed #84313a;border-radius:14px;background:#201719
}
.file-label{
display:block;text-align:center;padding:13px;
border-radius:10px;background:#3b191e;color:#fff;
cursor:pointer;margin:0
}
.file-name{color:#aaa;font-size:12px;margin-top:10px;overflow-wrap:anywhere;line-height:1.8}
.file-input{display:none}
button{
width:100%;border:0;border-radius:13px;padding:15px;margin-top:19px;
background:linear-gradient(100deg,#ed3948,#a91623);
color:white;font-size:15px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6;cursor:wait}
.status{display:none;margin-top:14px;padding:12px;border-radius:12px;font-size:13px;line-height:1.8;overflow-wrap:anywhere}
.status.show{display:block}
.status.ok{background:#123322;color:#a7f3c4}
.status.err{background:#42191d;color:#ffb5bc}
.foot{text-align:center;color:#777;font-size:11px;margin-top:20px}
.hp{position:absolute;right:-10000px;opacity:0}
</style>
</head>

<body>
<main class="card">

<header class="logo">
<div class="mark">؟</div>
<h1>ناشناس اسکرول گپ</h1>
<div class="sub">حرف دلت رو بدون نمایش اسمت به گوش ادمین برسون ❤️</div>
</header>

<div class="line"></div>

<form id="form" enctype="multipart/form-data">

<label>پیامت برای کدوم ادمینه؟</label>

<div class="admins">
<label class="admin"><input type="radio" name="admin" value="معین"><span>معین</span></label>
<label class="admin"><input type="radio" name="admin" value="حاجی"><span>حاجی</span></label>
<label class="admin"><input type="radio" name="admin" value="رقیه"><span>رقیه</span></label>
<label class="admin"><input type="radio" name="admin" value="مارال"><span>مارال</span></label>
<label class="admin"><input type="radio" name="admin" value="سجاد"><span>سجاد</span></label>
<label class="admin"><input type="radio" name="admin" value="عرفان" checked><span>عرفان</span></label>
<label class="admin"><input type="radio" name="admin" value="امیر"><span>امیر</span></label>
<label class="admin"><input type="radio" name="admin" value="خلخالی"><span>خلخالی</span></label>
</div>

<label for="message">پیام ناشناس تو</label>
<textarea id="message" name="message" maxlength="2000" placeholder="پیامت رو اینجا بنویس..."></textarea>

<div class="hint">
می‌تونی فقط فایل بفرستی یا متن و فایل رو با هم ارسال کنی.
</div>

<div class="file-box">
<label class="file-label" for="file">📎 انتخاب فایل</label>
<input class="file-input" type="file" id="file" name="file"
accept="image/*,video/*,audio/*,.pdf">
<div id="fileName" class="file-name">هنوز فایلی انتخاب نکردی</div>
<div class="hint">عکس، ویدیو، صوت یا PDF · حداکثر ۱۰ مگابایت</div>
</div>

<input class="hp" type="text" name="website" tabindex="-1" autocomplete="off">

<button id="submit" type="submit">ارسال پیام ناشناس</button>
<div id="status" class="status" role="status" aria-live="polite"></div>

</form>

<footer class="foot">NASHENAS SCROLL GAP · پیام ناشناس</footer>
</main>

<script>
const form = document.getElementById('form');
const btn = document.getElementById('submit');
const statusBox = document.getElementById('status');
const fileInput = document.getElementById('file');
const fileName = document.getElementById('fileName');
const messageInput = document.getElementById('message');

let sending = false;

function show(text,type){
statusBox.textContent = text;
statusBox.className = 'status show ' + type;
}

fileInput.addEventListener('change',()=>{
const file = fileInput.files[0];

if(!file){
fileName.textContent = 'هنوز فایلی انتخاب نکردی';
return;
}

if(file.size > 10*1024*1024){
fileInput.value = '';
fileName.textContent = 'هنوز فایلی انتخاب نکردی';
show('حجم فایل نباید بیشتر از ۱۰ مگابایت باشد.','err');
return;
}

fileName.textContent =
'📎 '+file.name+' ('+(file.size/1024/1024).toFixed(2)+' مگابایت)';
statusBox.className = 'status';
});

form.addEventListener('submit',async(e)=>{
e.preventDefault();

if(sending)return;

const adminInput = form.querySelector('input[name="admin"]:checked');
const message = messageInput.value.trim();
const file = fileInput.files[0];

if(!adminInput){
show('اول یک ادمین انتخاب کن.','err');
return;
}

if(message.length < 2 && !file){
show('متن پیام یا یک فایل انتخاب کن.','err');
return;
}

if(file && file.size > 10*1024*1024){
show('حجم فایل نباید بیشتر از ۱۰ مگابایت باشد.','err');
return;
}

sending = true;
btn.disabled = true;
btn.textContent = 'در حال ارسال...';
statusBox.className = 'status';

const formData = new FormData(form);

try{
const controller = new AbortController();
const timeout = setTimeout(()=>controller.abort(),90000);

let response;

try{
response = await fetch('/send',{
method:'POST',
body:formData,
signal:controller.signal
});
}finally{
clearTimeout(timeout);
}

const raw = await response.text();
let data;

try{
data = JSON.parse(raw);
}catch{
throw new Error('پاسخ سرور معتبر نیست. کد وضعیت: '+response.status);
}

if(!response.ok || !data.ok){
throw new Error(data.message || 'ارسال انجام نشد. کد: '+response.status);
}

show(data.message || 'پیام با موفقیت ارسال شد ❤️','ok');
form.reset();
fileName.textContent = 'هنوز فایلی انتخاب نکردی';

}catch(err){
if(err.name === 'AbortError'){
show('زمان ارسال تمام شد. ممکن است فایل بزرگ باشد یا سرور پاسخ نداده باشد.','err');
}else{
show(err.message || 'ارتباط با سرور برقرار نشد.','err');
}
}finally{
sending = false;
btn.disabled = false;
btn.textContent = 'ارسال پیام ناشناس';
}
});
</script>

</body>
</html>
