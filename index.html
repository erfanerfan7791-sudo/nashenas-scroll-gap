<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <title>ناشناس اسکرول گپ</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#351014 0,#151515 42%,#090909 100%);color:#f5f5f5;font-family:Tahoma,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:22px}
    .card{width:100%;max-width:460px;background:#151515;border:1px solid #4b2024;border-radius:24px;padding:26px;box-shadow:0 18px 60px #0009,0 0 30px #b21e2b18}
    .logo{text-align:center;margin-bottom:24px}.logo .mark{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:18px;background:linear-gradient(145deg,#f04452,#8d101b);font-size:28px;font-weight:bold;box-shadow:0 8px 28px #e21d303d}
    h1{font-size:25px;margin:14px 0 7px}.sub{color:#aaa;font-size:13px;line-height:1.9}.line{height:1px;background:linear-gradient(90deg,transparent,#a8202b,transparent);margin:22px 0}
    label{display:block;font-size:14px;font-weight:bold;margin:16px 0 9px}.admins{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.admin{position:relative}.admin input{position:absolute;opacity:0}.admin span{display:block;text-align:center;padding:13px 8px;border:1px solid #393939;border-radius:12px;background:#202020;color:#ddd;cursor:pointer}.admin input:checked+span{border-color:#f04452;background:#51171d;color:#fff;box-shadow:0 0 0 1px #f0445244}
    textarea{width:100%;min-height:145px;resize:vertical;background:#202020;border:1px solid #3b3b3b;border-radius:14px;color:#fff;padding:14px;font:14px Tahoma;line-height:1.9;outline:none}textarea:focus{border-color:#e33b49}.hint{color:#888;font-size:11px;margin-top:7px;line-height:1.8}
    button{width:100%;border:0;border-radius:13px;padding:15px;margin-top:19px;background:linear-gradient(100deg,#ed3948,#a91623);color:white;font-size:15px;font-weight:bold;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{display:none;margin-top:14px;padding:12px;border-radius:12px;font-size:13px;line-height:1.8}.status.show{display:block}.status.ok{background:#123322;color:#a7f3c4}.status.err{background:#42191d;color:#ffb5bc}.foot{text-align:center;color:#777;font-size:11px;margin-top:20px}.hp{position:absolute;right:-10000px;opacity:0}
  </style>
</head>
<body>
  <main class="card">
    <header class="logo"><div class="mark">؟</div><h1>ناشناس اسکرول گپ</h1><div class="sub">حرف دلت رو بدون نمایش اسمت به گوش ادمین برسون ❤️</div></header>
    <div class="line"></div>
    <form id="form">
      <label>پیامت برای کدوم ادمینه؟</label>
      <div class="admins">
        <label class="admin"><input type="radio" name="admin" value="عرفان" checked><span>عرفان</span></label>
        <label class="admin"><input type="radio" name="admin" value="سجاد"><span>سجاد</span></label>
        <label class="admin"><input type="radio" name="admin" value="حاجی"><span>حاجی</span></label>
        <label class="admin"><input type="radio" name="admin" value="ریحانه"><span>ریحانه</span></label>
        <label class="admin"><input type="radio" name="admin" value="مارال"><span>مارال</span></label>
        <label class="admin"><input type="radio" name="admin" value="معین"><span>معین</span></label>
        <label class="admin"><input type="radio" name="admin" value="علی"><span>علی</span></label>
        <label class="admin"><input type="radio" name="admin" value="امیر"><span>امیر</span></label>
        <label class="admin"><input type="radio" name="admin" value="خلخالی"><span>خلخالی</span></label>
      </div>
      <label for="message">پیام ناشناس تو</label>
      <textarea id="message" maxlength="2000" minlength="2" placeholder="پیامت رو اینجا بنویس..." required></textarea>
      <div class="hint">پیامت همراه با نام ادمین انتخاب‌شده به کانال ارسال می‌شه. اسم فرستنده در متن پیام نمایش داده نمی‌شه.</div>
      <input class="hp" type="text" name="website" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button id="submit" type="submit">ارسال پیام ناشناس</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
    <footer class="foot">NASHENAS SCROLL GAP · پیام ناشناس</footer>
  </main>
<script>
const form=document.getElementById('form'),btn=document.getElementById('submit'),statusBox=document.getElementById('status');
form.addEventListener('submit',async e=>{
  e.preventDefault(); const message=document.getElementById('message').value.trim();
  const admin=form.querySelector('input[name="admin"]:checked').value;
  if(message.length<2){show('پیامت خیلی کوتاهه.','err');return;}
  btn.disabled=true;btn.textContent='در حال ارسال...';statusBox.className='status';
  try{
    const r=await fetch('/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({admin,message,website:document.getElementById('website').value})});
    const data=await r.json(); if(!r.ok||!data.ok) throw new Error(data.message||'ارسال انجام نشد.');
    show(data.message,'ok');form.reset();
  }catch(err){show(err.message||'ارتباط با سرور برقرار نشد.','err');}
  finally{btn.disabled=false;btn.textContent='ارسال پیام ناشناس';}
});
function show(text,type){statusBox.textContent=text;statusBox.className='status show '+type;}
</script>
</body>
</html>
